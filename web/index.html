<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'">
<title>조각조각 - 이미지 분할</title>
<meta name="description" content="이미지 한 장을 여러 조각으로 나누고, 조각마다 원본 크기로 키워서 PDF, JPG, PNG, Word, PowerPoint, 한글 파일로 저장해요. 파일은 기기 밖으로 나가지 않아요.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="조각조각">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">
<script type="module" src="js/app.js"></script>
</head>
<body data-screen="home" data-engine="idle" data-export="idle">
<!-- icon sprite: 24px grid, stroke 1.75, round caps/joins -->
<svg class="sprite" aria-hidden="true" focusable="false">
<defs>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></symbol>
<symbol id="i-chev-r" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5.5 12.5l4.2 4.2L18.5 7.8"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M7.5 3.5h6l5 5v10a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2z"/><path d="M13.5 3.5V7A1.5 1.5 0 0 0 15 8.5h3.5"/></symbol>
<symbol id="i-file-x" viewBox="0 0 24 24"><path d="M7.5 3.5h6l5 5v10a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2z"/><path d="M13.5 3.5V7A1.5 1.5 0 0 0 15 8.5h3.5"/><path d="M9.9 12.4l4.2 4.2M14.1 12.4l-4.2 4.2"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.25 10.5V8a3.75 3.75 0 0 1 7.5 0v2.5"/></symbol>
<symbol id="i-install" viewBox="0 0 24 24"><rect x="6.5" y="2.75" width="11" height="18.5" rx="2.5"/><path d="M12 8v6.5M9.5 12l2.5 2.5 2.5-2.5"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15.5v-11M7.75 8.75L12 4.5l4.25 4.25"/><path d="M4.5 14.5v3a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-3"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><path d="M12 14.5v-11M8.25 7.25L12 3.5l3.75 3.75"/><path d="M8.5 10.5h-1a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1"/></symbol>
<symbol id="i-plus-box" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8.5v7M8.5 12h7"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><path d="M6 12h.01M12 12h.01M18 12h.01" stroke-width="2.6"/></symbol>
<symbol id="i-more-v" viewBox="0 0 24 24"><path d="M12 6v.01M12 12v.01M12 18v.01" stroke-width="2.6"/></symbol>
<symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.5l8.2 14.25H3.8L12 4.5z"/><path d="M12 10.25v3.75M12 16.6v.05"/></symbol>

<symbol id="i-image-off" viewBox="0 0 24 24"><path d="M8 4.5h9.5a3 3 0 0 1 3 3v9.5M18.5 19.5h-12a3 3 0 0 1-3-3v-9A3 3 0 0 1 4.6 5.1"/><path d="M4 16.5l4.4-4.2a1.5 1.5 0 0 1 2.1 0l3.5 3.5"/><path d="M3.5 3.5l17 17"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.75 12S6 5.75 12 5.75 21.25 12 21.25 12 18 18.25 12 18.25 2.75 12 2.75 12z"/><circle cx="12" cy="12" r="2.75"/></symbol>
<symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M6.1 7.4C3.9 9.2 2.75 12 2.75 12S6 18.25 12 18.25c1.7 0 3.2-.5 4.4-1.2M9.8 6c.7-.15 1.4-.25 2.2-.25 6 0 9.25 6.25 9.25 6.25s-.8 1.5-2.3 3"/><path d="M4 4l16 16"/></symbol>

</svg>

<div class="app" id="app" data-step="0">
  <header class="topbar">
    <div class="topbar__row">
      <button type="button" class="iconbtn" data-action="back" aria-label="뒤로" hidden><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button>
      <div class="brand">
        <svg viewBox="0 0 28 28" aria-hidden="true"><rect x="1.5" y="1.5" width="11.5" height="11.5" rx="2.8"/><rect x="15" y="1.5" width="11.5" height="11.5" rx="2.8" opacity=".42"/><rect x="1.5" y="15" width="11.5" height="11.5" rx="2.8"/><rect x="15" y="15" width="11.5" height="11.5" rx="2.8"/></svg>
        <span>조각조각</span>
      </div>
      <span class="topbar__fill"></span>
      <button type="button" class="textbtn" data-action="install" hidden><svg class="ic ic--20" aria-hidden="true"><use href="#i-install"/></svg>앱 설치</button>
      <button type="button" class="textbtn" data-action="restart" hidden>처음으로</button>
    </div>
    <div class="steps" aria-hidden="true"><i></i><i></i><i></i></div>
  </header>

  <main class="view" id="view">
    <section class="screen screen--still home">
      <div class="home__left">
        <div class="home__copy">
          <h1 class="h1 h1--xl" tabindex="-1">어떤 이미지를
나눌까요?</h1>
          <p class="lead">한 장을 여러 조각으로 나누고, 조각마다 원본 크기에 맞게 키워 드려요.</p>
          <div id="home-notices"></div>
        </div>
        <ul class="facts">
          <li><svg class="ic ic--18" aria-hidden="true"><use href="#i-file"/></svg><span>JPG · PNG · PDF · 한글 · Word · PowerPoint</span></li>
          <li><svg class="ic ic--18" aria-hidden="true"><use href="#i-lock"/></svg><span>파일은 기기 밖으로 나가지 않아요</span></li>
          <li><svg class="ic ic--18" aria-hidden="true"><use href="#i-info"/></svg><a href="licenses.html">오픈소스 라이선스</a></li>
        </ul>
      </div>
      <div class="home__right">
        <div class="demo" aria-hidden="true"><div class="demo__grid"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
        <div class="drop" id="drop">
          <span class="drop__icon"><svg class="ic" aria-hidden="true"><use href="#i-upload"/></svg></span>
          <strong data-drop-title>파일을 여기에 끌어다 놓으세요</strong>
          <span class="cap">사진 한 장도, 여러 쪽짜리 문서도 괜찮아요</span>
          <div data-dock-slot></div>
        </div>
      </div>
    </section>
  </main>

  <div class="dock" id="dock"><button type="button" class="btn btn--primary btn--block" data-action="pick"><span class="n-only">사진·파일 고르기</span><span class="w-only">파일 고르기</span></button></div>
</div>

<!-- file pickers: always in the DOM, visually hidden (not display:none so they stay usable) -->
<input class="sr" id="input-photos" type="file" accept="image/*" multiple tabindex="-1" aria-hidden="true">
<input class="sr" id="input-files" type="file" multiple tabindex="-1" aria-hidden="true">

<div class="scrim" id="scrim" data-action="close-sheet"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"></div>
<div class="toast" id="toast" aria-hidden="true"></div>
<div class="dropveil" aria-hidden="true">여기에 놓으면 바로 시작해요</div>
<!-- one polite live region: toasts and notices are mirrored here -->
<div class="sr" id="live" role="status" aria-live="polite" aria-atomic="true"></div>

<noscript><p class="noscript">이 앱은 자바스크립트가 켜져 있어야 쓸 수 있어요. 브라우저 설정에서 자바스크립트를 켠 뒤 다시 열어 주세요.</p></noscript>
</body>
</html>
