name: Deploy site

# Publishes the app to GitHub Pages:
#   https://geunminmaker.github.io/split-image/              the app (web/)
#   https://geunminmaker.github.io/.well-known/assetlinks.json   lets the Android APK run full screen

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "splitcore/**"
      - "tools/**"
      - "android/assetlinks.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Package the Python engine and stamp the service worker
        run: python tools/build_web.py
      - name: Assemble the site
        run: python tools/make_site.py _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # .well-known/ and .nojekyll start with a dot and would be dropped otherwise
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
